name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint check
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Unit and integration tests
        run: npm run test

      - name: Mock security scan
        run: |
          echo "Running mock security scan..."
          echo "No critical vulnerabilities found."
